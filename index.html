<div id="brush-cursor" style="position: fixed; border: 2px solid rgba(0, 0, 0, 0.5); border-radius: 50%; pointer-events: none; display: none; z-index: 10000; transform: translate(-50%, -50%); will-change: transform; left: 0px; top: 0px; width: 2.01px; height: 2.01px;"></div>
<script>
(function () {
    function setText(selector, text) {
        const el = document.querySelector(selector);
        if (el) el.textContent = text;
    }

    function setTitle(selector, text) {
        const el = document.querySelector(selector);
        if (el) el.title = text;
    }

    function setPlaceholder(selector, text) {
        const el = document.querySelector(selector);
        if (el) el.placeholder = text;
    }

    function setLegend(index, text) {
        const legends = document.querySelectorAll('legend');
        if (legends[index]) legends[index].textContent = text;
    }

    function setLabelFor(forId, text) {
        const label = document.querySelector('label[for="' + forId + '"]');
        if (label) label.textContent = text;
    }

    function setOptionTexts(selector, values) {
        const options = document.querySelectorAll(selector + ' option');
        values.forEach((text, index) => {
            if (options[index]) options[index].textContent = text;
        });
    }

    function injectActivationTool() {
        const fieldsets = document.querySelectorAll('.main > fieldset');
        if (!fieldsets[1] || document.getElementById('activation-tool')) return;

        const wrapper = document.createElement('fieldset');
        wrapper.id = 'activation-tool';
        wrapper.innerHTML = [
            '<legend>Công cụ mã kích hoạt</legend>',
            '<div class="flex-container">',
            '  <div class="flex-group" style="flex: 2 1 420px;">',
            '    <label for="deviceKeyInput">4 ký tự cuối tên thiết bị</label>',
            '    <input type="text" id="deviceKeyInput" placeholder="Ví dụ: B5F1" maxlength="4" style="text-transform:uppercase">',
            '  </div>',
            '  <div class="flex-group" style="flex: 3 1 520px;">',
            '    <label for="activationMapInput">Bảng mã kích hoạt</label>',
            '    <textarea id="activationMapInput" rows="6" style="width:100%;min-height:120px;">B5F1:50495833',
            '7D3C:50869926',
            '4935:50666827',
            '2F4E:50974328',
            '975D:50573537</textarea>',
            '  </div>',
            '</div>',
            '<div class="flex-container">',
            '  <div class="flex-group">',
            '    <button type="button" class="primary" id="lookupActivationBtn">Tra mã</button>',
            '    <button type="button" class="secondary" id="fillActivationBtn">Đổ vào ô gửi lệnh</button>',
            '    <button type="button" class="secondary" id="sendActivationBtn">Gửi mã kích hoạt</button>',
            '  </div>',
            '</div>',
            '<div class="flex-container">',
            '  <div class="flex-group">',
            '    <label for="activationCodeOutput">Mã kích hoạt</label>',
            '    <input type="text" id="activationCodeOutput" readonly>',
            '  </div>',
            '  <div class="flex-group">',
            '    <label for="activationCommandOutput">Lệnh gửi</label>',
            '    <input type="text" id="activationCommandOutput" readonly>',
            '  </div>',
            '</div>',
            '<div class="log-container" id="activationToolStatus" style="min-height:48px;padding:8px 12px;color:#ddd;">',
            'Nhập 4 ký tự cuối tên thiết bị, ví dụ <code>B5F1</code>. Tool này hiện tra theo bảng mã bạn cung cấp và sẽ tạo lệnh dạng <code>EFxxxxxxxx</code>.',
            '</div>'
        ].join('');

        fieldsets[1].insertAdjacentElement('afterend', wrapper);

        const keyInput = document.getElementById('deviceKeyInput');
        const mapInput = document.getElementById('activationMapInput');
        const codeOutput = document.getElementById('activationCodeOutput');
        const cmdOutput = document.getElementById('activationCommandOutput');
        const statusBox = document.getElementById('activationToolStatus');

        function normalizeKey(value) {
            return String(value || '').toUpperCase().replace(/[^0-9A-F]/g, '').slice(0, 4);
        }

        function parseMap(text) {
            const map = new Map();
            String(text || '')
                .split(/\r?\n/)
                .map(line => line.trim())
                .filter(Boolean)
                .forEach(line => {
                    const match = line.match(/^([0-9A-Fa-f]{4})\s*[:=-]\s*([0-9A-Fa-f]{8})$/);
                    if (match) {
                        map.set(match[1].toUpperCase(), match[2].toUpperCase());
                    }
                });
            return map;
        }

        function setStatus(message) {
            statusBox.textContent = message;
        }

        function lookupActivation() {
            const key = normalizeKey(keyInput.value);
            keyInput.value = key;
            if (key.length !== 4) {
                codeOutput.value = '';
                cmdOutput.value = '';
                setStatus('Mã thiết bị phải gồm đúng 4 ký tự hex, ví dụ: B5F1.');
                return null;
            }

            const map = parseMap(mapInput.value);
            const code = map.get(key);
            if (!code) {
                codeOutput.value = '';
                cmdOutput.value = '';
                setStatus('Chưa có mã cho thiết bị ' + key + '. Hãy thêm một dòng theo dạng B5F1:50495833.');
                return null;
            }

            codeOutput.value = code;
            cmdOutput.value = 'EF' + code;
            setStatus('Đã tra được mã cho ' + key + '. Bạn có thể đổ vào ô gửi lệnh hoặc gửi trực tiếp.');
            return { key, code, command: 'EF' + code };
        }

        document.getElementById('lookupActivationBtn').addEventListener('click', lookupActivation);
        document.getElementById('fillActivationBtn').addEventListener('click', function () {
            const result = lookupActivation();
            if (!result) return;
            const cmdInput = document.getElementById('cmdTXT');
            if (cmdInput) {
                cmdInput.value = result.command;
                setStatus('Đã đổ lệnh ' + result.command + ' vào ô gửi lệnh.');
            }
        });
        document.getElementById('sendActivationBtn').addEventListener('click', async function () {
            const result = lookupActivation();
            if (!result) return;
            const cmdInput = document.getElementById('cmdTXT');
            if (!cmdInput || typeof window.sendcmd !== 'function') {
                setStatus('Không tìm thấy ô gửi lệnh hoặc hàm gửi lệnh trên trang.');
                return;
            }
            cmdInput.value = result.command;
            try {
                await window.sendcmd();
                setStatus('Đã gửi lệnh kích hoạt ' + result.command + '.');
            } catch (error) {
                setStatus('Gửi lệnh thất bại: ' + (error && error.message ? error.message : error));
            }
        });
        keyInput.addEventListener('input', function () {
            this.value = normalizeKey(this.value);
        });
    }

    function applyStaticTranslation() {
        document.title = 'Lịch Màn Hình E-Ink';
        setText('h3', 'Lịch Màn Hình E-Ink');

        setLegend(0, 'Kết nối Bluetooth');
        setLegend(1, 'Điều khiển thiết bị');
        setLegend(2, 'Truyền ảnh qua Bluetooth');

        setText('#connectbutton', 'Kết nối');
        setText('#reconnectbutton', 'Kết nối lại');
        setText('button[onclick="clearLog()"]', 'Xóa nhật ký');
        setLabelFor('epddriver', 'Driver');
        setLabelFor('epdpins', 'Chân kết nối');
        setText('#setDriverbutton', 'Xác nhận');

        setText('#calendarmodebutton', 'Chế độ lịch');
        setText('#clockmodebutton', 'Chế độ đồng hồ');
        setText('#clearscreenbutton', 'Xóa màn hình');
        setText('#sendcmdbutton', 'Gửi lệnh');

        setLabelFor('canvasSize', 'Kích thước canvas:');
        setLabelFor('ditherMode', 'Chế độ màu:');
        setLabelFor('ditherAlg', 'Thuật toán dithering:');
        setLabelFor('ditherStrength', 'Cường độ dithering:');
        setLabelFor('ditherContrast', 'Độ tương phản:');
        setLabelFor('mtusize', 'MTU:');
        setLabelFor('interleavedcount', 'Khoảng xác nhận:');
        setText('.status-bar b', 'Trạng thái:');

        const mainButtons = document.querySelectorAll('fieldset:nth-of-type(3) > .flex-container:nth-of-type(4) button');
        if (mainButtons[0]) mainButtons[0].textContent = 'Xoay canvas';

    function applyDynamicTranslation() {
        const reconnect = document.getElementById('reconnectbutton');
        if (reconnect) reconnect.textContent = 'Kết nối lại';

        const connect = document.getElementById('connectbutton');
        if (connect) {
            const rawText = String(connect.textContent || '').trim();
            if (rawText.includes('断开') || rawText.toLowerCase() === 'disconnect') {
                connect.textContent = 'Ngắt kết nối';
            } else if (rawText.includes('连接') || rawText.toLowerCase() === 'connect') {
                connect.textContent = 'Kết nối';
            } else if (!rawText) {
                connect.textContent = 'Kết nối';
            }
        }

        const log = document.getElementById('log');
        if (log) {
            log.innerHTML = log.innerHTML
                .replace(/连接成功/g, 'Kết nối thành công')
                .replace(/连接失败/g, 'Kết nối thất bại')
                .replace(/断开连接/g, 'Ngắt kết nối')
                .replace(/发送成功/g, 'Gửi thành công')
                .replace(/发送失败/g, 'Gửi thất bại')
                .replace(/设备/g, 'thiết bị')
                .replace(/状态/g, 'trạng thái');
        }
    }

    function installDialogHooks() {
        const originalAlert = window.alert;
        const originalConfirm = window.confirm;

        window.alert = function (message) {
            let text = String(message)
                .replace(/连接成功/g, 'Kết nối thành công')
                .replace(/连接失败/g, 'Kết nối thất bại')
                .replace(/断开连接/g, 'Ngắt kết nối')
                .replace(/请先连接设备/g, 'Vui lòng kết nối thiết bị trước')
                .replace(/请输入文字/g, 'Vui lòng nhập văn bản')
                .replace(/发送成功/g, 'Gửi thành công')
                .replace(/发送失败/g, 'Gửi thất bại');
            return originalAlert.call(this, text);
        };

        window.confirm = function (message) {
            let text = String(message)
                .replace(/确定/g, 'Xác nhận')
                .replace(/清除屏幕/g, 'xóa màn hình');
            return originalConfirm.call(this, text);
        };
    }

    document.addEventListener('DOMContentLoaded', function () {
        applyStaticTranslation();
        injectActivationTool();
        installDialogHooks();
        setInterval(applyDynamicTranslation, 500);
    });
})();
